# Link runtime statically so Visual C++ Redist is not required
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[profile.ci]
inherits  = "dev"
opt-level = 0
debug     = false
