[color-theme]
name = "sparrow Light"

[ui]
font-family = ""
font-size = 13
header-height = 34
status-height = 24
tab-min-width = 100
activity-width = 34
scroll-width = 10
drop-shadow-width = 0

[color-theme.base]
black = "#080808"
blue = "#3574F0"
cyan = "#0A8A99"
green = "#1E8E3E"
grey = "#D3D5DB"
magenta = "#871094"
orange = "#C77D55"
purple = "#871094"
red = "#E55765"
white = "#FFFFFF"
yellow = "#E5B000"

# Island fill (editor + tool windows)
primary-background = "#FFFFFF"
# Window frame (title bar, stripes, status bar, gaps between islands)
secondary-background = "#EBECF0"
current-background = "#DFE1E5"
text = "#080808"
dim-text = "#6C707E"

[color-theme.syntax]
"comment" = "#8C8C8C"
"constant" = "#871094"
"type" = "#080808"
"typeAlias" = "#080808"
"number" = "#1750EB"
"enum" = "#080808"
"struct" = "#080808"
"structure" = "#080808"
"interface" = "#080808"
"attribute" = "#9E880D"
"constructor" = "#080808"
"function" = "#00627A"
"method" = "#00627A"
"function.method" = "#00627A"
"keyword" = "#0033B3"
"selfKeyword" = "#0033B3"
"field" = "#871094"
"property" = "#871094"
"enumMember" = "#871094"
"enum-member" = "#871094"
"string" = "#067D17"
"type.builtin" = "#0033B3"
"builtinType" = "#0033B3"
"escape" = "#0037A6"
"string.escape" = "#0037A6"
"embedded" = "#080808"
"punctuation.delimiter" = "#080808"
"text.title" = "#0033B3"
"text.uri" = "#006DCC"
"text.reference" = "#006DCC"
"variable" = "#080808"
"variable.other.member" = "#871094"
"tag" = "#0033B3"

"markup.heading" = "#0033B3"
"markup.bold" = "#0033B3"
"markup.italic" = "#0033B3"
"markup.list" = "#0033B3"
"markup.link.url" = "#006DCC"
"markup.link.label" = "#871094"
"markup.link.text" = "#871094"

"bracket.color.1" = "#080808"
"bracket.color.2" = "#9E880D"
"bracket.color.3" = "#871094"
"bracket.unpaired" = "#E55765"

[color-theme.ui]
"sparrow.error" = "$red"
"sparrow.warn" = "$yellow"
"sparrow.dropdown_shadow" = "#00000033"
"sparrow.border" = "#D3D5DB"
"sparrow.scroll_bar" = "#C9CCD6"

"sparrow.window.background" = "#EBECF0"
"sparrow.run.icon" = "#5FB865"

"sparrow.button.primary.background" = "#3574F0"
"sparrow.button.primary.foreground" = "#FFFFFF"

# tabs: the active tab is a rounded blue pill, inactive tabs are plain text
"sparrow.tab.active.background" = "#D5E2FF"
"sparrow.tab.active.foreground" = "#080808"
"sparrow.tab.active.underline" = "#D5E2FF"
"sparrow.tab.active.border" = "#A8C2F7"

"sparrow.tab.inactive.background" = "#00000000"
"sparrow.tab.inactive.foreground" = "#080808"
"sparrow.tab.inactive.underline" = "#00000000"

"sparrow.tab.separator" = ""

"sparrow.icon.active" = "#5A5D6B"
"sparrow.icon.inactive" = "#8E92A3"

"sparrow.remote.icon" = "#080808"
"sparrow.remote.local" = "#3574F0"
"sparrow.remote.connected" = "#5FB865"
"sparrow.remote.connecting" = "#E5B000"
"sparrow.remote.disconnected" = "#E55765"

"sparrow.plugin.name" = "#080808"
"sparrow.plugin.description" = "$text"
"sparrow.plugin.author" = "#6C707E"

"editor.background" = "$primary-background"
"editor.foreground" = "$text"
"editor.dim" = "$dim-text"
"editor.focus" = "#3574F0"
"editor.caret" = "#080808"
"editor.selection" = "#A6D2FF"
"editor.current_line" = "#FCFAED"
"editor.debug_break_line" = "#3574F033"
"editor.link" = "#006DCC"
"editor.visible_whitespace" = "#D3D5DB"
"editor.indent_guide" = "#EBECF0"
"editor.drag_drop_background" = "#3574F033"
"editor.drag_drop_tab_background" = "#00000022"
"editor.sticky_header_background" = "$primary-background"

"inlay_hint.foreground" = "#6C707E"
"inlay_hint.background" = "#EBECF0"

"error_lens.error.foreground" = "$red"
"error_lens.error.background" = "#E5576520"
"error_lens.warning.foreground" = "#9E6B00"
"error_lens.warning.background" = "#E5B00020"
"error_lens.other.foreground" = "$dim-text"
"error_lens.other.background" = "#6C707E20"

"completion_lens.foreground" = "$dim-text"

"source_control.added" = "#5FB865CC"
"source_control.removed" = "#E55765CC"
"source_control.modified" = "#3574F0CC"

"tooltip.background" = "#F2F2F2"
"tooltip.foreground" = "$text"

"palette.background" = "#FFFFFF"
"palette.foreground" = "$text"
"palette.current.background" = "#D5E2FF"
"palette.current.foreground" = "#080808"

"completion.background" = "#FFFFFF"
"completion.current" = "#D5E2FF"

"hover.background" = "#FFFFFF"

# Tool-window stripes
"activity.background" = "#EBECF0"
"activity.current" = "#DFE1E5"

"debug.breakpoint" = "$red"
"debug.breakpoint.hover" = "#E5576566"

# Tool-window islands
"panel.background" = "#FFFFFF"
"panel.foreground" = "$text"
"panel.foreground.dim" = "$dim-text"
"panel.current.background" = "#DFE1E5"
"panel.current.foreground" = "#080808"
"panel.current.foreground.dim" = "$dim-text"
"panel.hovered.background" = "#F2F3F7"
"panel.hovered.active.background" = "#D5E2FF"
"panel.hovered.foreground" = "$text"
"panel.hovered.foreground.dim" = "$dim-text"

# Status bar shares the window-frame colour
"status.background" = "#EBECF0"
"status.foreground" = "#080808"
"status.modal.normal.background" = "$blue"
"status.modal.normal.foreground" = "#FFFFFF"
"status.modal.insert.background" = "$red"
"status.modal.insert.foreground" = "#FFFFFF"
"status.modal.visual.background" = "$yellow"
"status.modal.visual.foreground" = "#080808"
"status.modal.terminal.background" = "$purple"
"status.modal.terminal.foreground" = "#FFFFFF"

"markdown.blockquote" = "#6C707E"

"terminal.cursor" = "$text"
"terminal.foreground" = "$text"
"terminal.background" = "#FFFFFF"
"terminal.white" = "#80838D"
"terminal.black" = "#080808"
"terminal.red" = "#D13F4D"
"terminal.blue" = "#3574F0"
"terminal.green" = "#1E8E3E"
"terminal.yellow" = "#A67B00"
"terminal.cyan" = "#0A8A99"
"terminal.magenta" = "#9C3DB3"
"terminal.bright_white" = "#3A3D45"
"terminal.bright_red" = "#E55765"
"terminal.bright_blue" = "#2470B3"
"terminal.bright_green" = "#067D17"
"terminal.bright_yellow" = "#B58900"
"terminal.bright_cyan" = "#0A8A99"
"terminal.bright_magenta" = "#871094"
"terminal.bright_black" = "#6C707E"