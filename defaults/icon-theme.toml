#:schema ../extra/schemas/icon-theme.json

[icon-theme]
name = "sparrow Modern"

[icon-theme.ui]
# ── Branding ─────────────────────────────────────────────────────────────
"logo"           = "sparrow_logo.svg"
"menu"           = "menu.svg"                    # Lucide: menu
"link"           = "link.svg"                    # Lucide: link
"remote"         = "radio-tower.svg"             # Lucide: radio-tower
"error"          = "circle-alert.svg"            # Lucide: circle-alert
"add"            = "plus.svg"                    # Lucide: plus
"close"          = "x.svg"                       # Lucide: x
"unsaved"        = "circle-filled.svg"           # Lucide: circle (filled variant)
"warning"        = "triangle-alert.svg"          # Lucide: triangle-alert
"problem"        = "circle-alert.svg"            # Lucide: circle-alert

# ── Debug (Tabler for step/restart/bug) ──────────────────────────────────
"debug"              = "bug.svg"                 # Tabler: bug
"debug_alt"          = "bug-play.svg"            # Tabler: bug-play
"debug_small"        = "bug.svg"                 # Tabler: bug
"debug_breakpoint"   = "circle-dot.svg"          # Lucide: circle-dot
"debug_restart"      = "player-track-next.svg"   # Tabler
"debug_continue"     = "player-play.svg"         # Tabler
"debug_step_over"    = "player-step-over.svg"    # Tabler (exact name)
"debug_step_into"    = "player-step-into.svg"    # Tabler
"debug_step_out"     = "player-step-out.svg"     # Tabler
"debug_pause"        = "player-pause.svg"        # Tabler
"debug_stop"         = "player-stop.svg"         # Tabler
"debug_console"      = "terminal.svg"            # Lucide: terminal
"debug_disconnect"   = "unplug.svg"              # Lucide: unplug
"start"              = "player-play.svg"         # Tabler
"run_errors"         = "circle-x.svg"            # Lucide: circle-x

# ── Windows ──────────────────────────────────────────────────────────────
"window.close"     = "chrome-close.svg"          # Lucide: x
"window.restore"   = "chrome-restore.svg"        # Lucide: square (restore variant)
"window.maximize"  = "chrome-maximize.svg"       # Lucide: maximize
"window.minimize"  = "chrome-minimize.svg"       # Lucide: minimize

# ── Files / Explorer ─────────────────────────────────────────────────────
"file"            = "file.svg"                   # Lucide: file
"file_explorer"   = "files.svg"                  # Lucide: files
"file_picker_up"  = "arrow-up.svg"               # Lucide: arrow-up
"image_loading"   = "refresh-cw.svg"             # Lucide: refresh-cw
"image_error"     = "circle-alert.svg"           # Lucide: circle-alert

# ── Source control ───────────────────────────────────────────────────────
"scm.icon"           = "git-branch.svg"          # Lucide: git-branch
"scm.diff.modified"  = "diff-modified.svg"       # Lucide: pencil-line
"scm.diff.added"     = "diff-added.svg"          # Lucide: plus
"scm.diff.removed"   = "diff-removed.svg"        # Lucide: minus
"scm.diff.renamed"   = "diff-renamed.svg"        # Lucide: arrow-right-left
"scm.change.add"     = "add.svg"                 # Lucide: plus
"scm.change.remove"  = "remove.svg"              # Lucide: minus

# ── Panels / folding ─────────────────────────────────────────────────────
"palette.menu"       = "chevron-down.svg"        # Lucide
"fold"               = "chevrons-down-up.svg"    # Lucide
"fold.up"            = "chevrons-up.svg"         # Lucide
"fold.down"          = "chevrons-down.svg"       # Lucide
"dropdown.arrow"     = "chevron-down.svg"        # Lucide
"panel.fold-down"    = "chevron-down.svg"        # Lucide
"panel.fold-up"      = "chevron-right.svg"       # Lucide

# ── Navigation ───────────────────────────────────────────────────────────
"location.forward"   = "arrow-right.svg"         # Lucide
"location.backward"  = "arrow-left.svg"          # Lucide
"item.opened"        = "chevron-down.svg"        # Lucide
"item.closed"        = "chevron-right.svg"       # Lucide
"directory.closed"   = "folder.svg"              # Lucide
"directory.opened"   = "folder-open.svg"         # Lucide

# ── Layout ───────────────────────────────────────────────────────────────
"panel.restore"      = "chevron-down.svg"        # Lucide
"panel.maximise"     = "chevron-right.svg"       # Lucide
"split.horizontal"   = "split-square-horizontal.svg"  # Lucide
"tab.previous"       = "chevron-left.svg"        # Lucide
"tab.next"           = "chevron-right.svg"       # Lucide
"sidebar.left.on"    = "panel-left.svg"          # Lucide
"sidebar.left.off"   = "panel-left-close.svg"    # Lucide
"sidebar.right.on"   = "panel-right.svg"         # Lucide
"sidebar.right.off"  = "panel-right-close.svg"   # Lucide
"layout.panel.on"    = "panel-bottom.svg"        # Lucide
"layout.panel.off"   = "panel-bottom-close.svg"  # Lucide

# ── Search ───────────────────────────────────────────────────────────────
"search.icon"            = "search.svg"          # Lucide
"search.clear"           = "x.svg"               # Lucide
"search.forward"         = "arrow-down.svg"      # Lucide
"search.backward"        = "arrow-up.svg"        # Lucide
"search.case_sensitive"  = "case-sensitive.svg"  # Lucide
"search.whole_word"      = "whole-word.svg"      # Lucide
"search.regex"           = "regex.svg"           # Lucide
"search.replace"         = "replace.svg"         # Lucide
"search.replace_all"     = "replace-all.svg"     # Lucide

# ── Editor / LSP ─────────────────────────────────────────────────────────
"settings"          = "settings.svg"             # Lucide
"terminal"          = "terminal.svg"             # Lucide
"lightbulb"         = "lightbulb.svg"            # Lucide
"extensions"        = "puzzle.svg"               # Lucide
"keyboard"          = "keyboard.svg"             # Lucide
"breadcrumb_separator" = "chevron-right.svg"     # Lucide
"symbol_color"      = "palette.svg"              # Lucide
"type_hierarchy"    = "network.svg"              # Lucide
"document_symbol"   = "file-text.svg"            # Lucide
"references"        = "link.svg"                 # Lucide
"implementation"    = "combine.svg"              # Lucide

[icon-theme.filename]
"pubspec.yaml"   = "pub_logo.svg"
"pubspec.lock"   = "pub_logo.svg"
"analysis_options.yaml" = "dart_logo.svg"
"main.dart"      = "dart_logo.svg"
"test.dart"      = "flutter_logo.svg"  # only works if user names it that

[icon-theme.extension]
"dart"      = "dart_logo.svg"
"arb"       = "flutter_logo.svg"  # Flutter localisation