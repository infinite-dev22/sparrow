# Android Studio / IntelliJ "Islands" dark theme.
# Island and frame colours were sampled from a real Android Studio screenshot.

[color-theme]
name = "Islands Dark"

[ui]
font-family = ""
font-size = 13
header-height = 34
status-height = 24
tab-min-width = 100
activity-width = 34
scroll-width = 10
drop-shadow-width = 0

[color-theme.base]
black = "#191A1C"
blue = "#548AF7"
cyan = "#2AACB8"
green = "#6AAB73"
grey = "#323438"
magenta = "#C77DBB"
orange = "#CF8E6D"
purple = "#C77DBB"
red = "#F75464"
white = "#DFE1E5"
yellow = "#F2C55C"

# Island fill (editor + tool windows)
primary-background = "#191A1C"
# Window frame (title bar, stripes, status bar, gaps between islands)
secondary-background = "#26282C"
current-background = "#33353B"
text = "#BCBEC4"
dim-text = "#6F737A"

[color-theme.syntax]
"comment" = "#7A7E85"
"constant" = "#C77DBB"
"type" = "#BCBEC4"
"typeAlias" = "#BCBEC4"
"number" = "#2AACB8"
"enum" = "#BCBEC4"
"struct" = "#BCBEC4"
"structure" = "#BCBEC4"
"interface" = "#BCBEC4"
"attribute" = "#B3AE60"
"constructor" = "#BCBEC4"
"function" = "#56A8F5"
"method" = "#56A8F5"
"function.method" = "#56A8F5"
"keyword" = "#CF8E6D"
"selfKeyword" = "#CF8E6D"
"field" = "#C77DBB"
"property" = "#C77DBB"
"enumMember" = "#C77DBB"
"enum-member" = "#C77DBB"
"string" = "#6AAB73"
"type.builtin" = "#CF8E6D"
"builtinType" = "#CF8E6D"
"escape" = "#CF8E6D"
"string.escape" = "#CF8E6D"
"embedded" = "#BCBEC4"
"punctuation.delimiter" = "#BCBEC4"
"text.title" = "#CF8E6D"
"text.uri" = "#548AF7"
"text.reference" = "#548AF7"
"variable" = "#BCBEC4"
"variable.other.member" = "#C77DBB"
"tag" = "#D5B778"

"markup.heading" = "#CF8E6D"
"markup.bold" = "#CF8E6D"
"markup.italic" = "#CF8E6D"
"markup.list" = "#CF8E6D"
"markup.link.url" = "#548AF7"
"markup.link.label" = "#C77DBB"
"markup.link.text" = "#C77DBB"

"bracket.color.1" = "#BCBEC4"
"bracket.color.2" = "#F2C55C"
"bracket.color.3" = "#C77DBB"
"bracket.unpaired" = "#F75464"

[color-theme.ui]
"sparrow.error" = "$red"
"sparrow.warn" = "$yellow"
"sparrow.dropdown_shadow" = "#00000066"
"sparrow.border" = "#323438"
"sparrow.scroll_bar" = "#3D3E3F"

"sparrow.window.background" = "#26282C"
"sparrow.run.icon" = "#57955C"

"sparrow.button.primary.background" = "#3574F0"
"sparrow.button.primary.foreground" = "#FFFFFF"

# tabs: the active tab is a rounded blue pill, inactive tabs are plain text
"sparrow.tab.active.background" = "#233558"
"sparrow.tab.active.foreground" = "#DFE1E5"
"sparrow.tab.active.underline" = "#233558"
"sparrow.tab.active.border" = "#2E4D89"

"sparrow.tab.inactive.background" = "#00000000"
"sparrow.tab.inactive.foreground" = "#BCBEC4"
"sparrow.tab.inactive.underline" = "#00000000"

"sparrow.tab.separator" = ""

"sparrow.icon.active" = "#CED0D6"
"sparrow.icon.inactive" = "#6F737A"

"sparrow.remote.icon" = "#DFE1E5"
"sparrow.remote.local" = "#548AF7"
"sparrow.remote.connected" = "#57955C"
"sparrow.remote.connecting" = "#F2C55C"
"sparrow.remote.disconnected" = "#F75464"

"sparrow.plugin.name" = "#DFE1E5"
"sparrow.plugin.description" = "$text"
"sparrow.plugin.author" = "#6F737A"

"editor.background" = "$primary-background"
"editor.foreground" = "$text"
"editor.dim" = "$dim-text"
"editor.focus" = "#CED0D6"
"editor.caret" = "#CED0D6"
"editor.selection" = "#214283"
"editor.current_line" = "#1F2024"
"editor.debug_break_line" = "#548AF737"
"editor.link" = "#548AF7"
"editor.visible_whitespace" = "#3D3E3F"
"editor.indent_guide" = "#323438"
"editor.drag_drop_background" = "#548AF755"
"editor.drag_drop_tab_background" = "#00000055"
"editor.sticky_header_background" = "$primary-background"

"inlay_hint.foreground" = "#7A7E85"
"inlay_hint.background" = "#2B2D30"

"error_lens.error.foreground" = "$red"
"error_lens.error.background" = "#F7546420"
"error_lens.warning.foreground" = "$yellow"
"error_lens.warning.background" = "#F2C55C20"
"error_lens.other.foreground" = "$dim-text"
"error_lens.other.background" = "#6F737A20"

"completion_lens.foreground" = "$dim-text"

"source_control.added" = "#57955CCC"
"source_control.removed" = "#F75464CC"
"source_control.modified" = "#548AF7CC"

"tooltip.background" = "#2B2D30"
"tooltip.foreground" = "$text"

"palette.background" = "#2B2D30"
"palette.foreground" = "$text"
"palette.current.background" = "#2E436E"
"palette.current.foreground" = "#DFE1E5"

"completion.background" = "#2B2D30"
"completion.current" = "#2E436E"

"hover.background" = "#2B2D30"

# Tool-window stripes
"activity.background" = "#26282C"
"activity.current" = "#3A3D42"

"debug.breakpoint" = "$red"
"debug.breakpoint.hover" = "#F7546466"

# Tool-window islands
"panel.background" = "#191A1C"
"panel.foreground" = "$text"
"panel.foreground.dim" = "$dim-text"
"panel.current.background" = "#33353B"
"panel.current.foreground" = "#DFE1E5"
"panel.current.foreground.dim" = "$dim-text"
"panel.hovered.background" = "#2B2D30"
"panel.hovered.active.background" = "#3A3D42"
"panel.hovered.foreground" = "$text"
"panel.hovered.foreground.dim" = "$dim-text"

# Status bar shares the window-frame colour
"status.background" = "#26282C"
"status.foreground" = "#BCBEC4"
"status.modal.normal.background" = "$blue"
"status.modal.normal.foreground" = "#191A1C"
"status.modal.insert.background" = "$red"
"status.modal.insert.foreground" = "#191A1C"
"status.modal.visual.background" = "$yellow"
"status.modal.visual.foreground" = "#191A1C"
"status.modal.terminal.background" = "$purple"
"status.modal.terminal.foreground" = "#191A1C"

"markdown.blockquote" = "#7A7E85"

"terminal.cursor" = "$text"
"terminal.foreground" = "$text"
"terminal.background" = "#191A1C"
"terminal.white" = "#BCBEC4"
"terminal.black" = "#191A1C"
"terminal.red" = "#F75464"
"terminal.blue" = "#548AF7"
"terminal.green" = "#6AAB73"
"terminal.yellow" = "#F2C55C"
"terminal.cyan" = "#2AACB8"
"terminal.magenta" = "#C77DBB"
"terminal.bright_white" = "#DFE1E5"
"terminal.bright_red" = "#F75464"
"terminal.bright_blue" = "#56A8F5"
"terminal.bright_green" = "#6AAB73"
"terminal.bright_yellow" = "#F2C55C"
"terminal.bright_cyan" = "#2AACB8"
"terminal.bright_magenta" = "#C77DBB"
"terminal.bright_black" = "#6F737A"