# =====================================================================
# Android Studio / IntelliJ "macOS" keymap. Append to defaults/keymaps-macos.toml
# (later entries win). Commands are the same as the Windows/Linux block.
# Some chords (meta+n, meta+o, meta+d, meta+g) replace existing macOS defaults;
# delete any line you want to keep the old behaviour for.
# =====================================================================

# Reformat Code
[[keymaps]]
key = "meta+alt+l"
command = "format_document"
when = "editor_focus"

# Reformat Code... (options)
[[keymaps]]
key = "meta+alt+shift+l"
command = "reformat_code_options"

# Optimize Imports
[[keymaps]]
key = "ctrl+alt+o"
command = "optimize_imports"
when = "editor_focus"

# Add Selection for Next Occurrence
[[keymaps]]
key = "ctrl+g"
command = "select_next_current"
mode = "i"

# Unselect Occurrence
[[keymaps]]
key = "ctrl+shift+g"
command = "select_undo"
mode = "i"

# Select All Occurrences
[[keymaps]]
key = "ctrl+meta+g"
command = "select_all_current"
mode = "i"

# Duplicate Line or Selection
[[keymaps]]
key = "meta+d"
command = "duplicate_line_down"
when = "editor_focus"
mode = "i"

# Delete Line
[[keymaps]]
key = "meta+backspace"
command = "delete_line"
when = "editor_focus"
mode = "i"

# Join Lines
[[keymaps]]
key = "ctrl+shift+j"
command = "join_lines"
mode = "i"

# Move Line Up
[[keymaps]]
key = "alt+shift+up"
command = "move_line_up"
mode = "i"

# Move Line Down
[[keymaps]]
key = "alt+shift+down"
command = "move_line_down"
mode = "i"

# Extend Selection
[[keymaps]]
key = "alt+up"
command = "select_next_syntax_item"
when = "editor_focus"

# Shrink Selection
[[keymaps]]
key = "alt+down"
command = "select_previous_syntax_item"
when = "editor_focus"

# Quick Documentation
[[keymaps]]
key = "ctrl+j"
command = "show_hover"
when = "editor_focus"
mode = "i"

# Navigate Back
[[keymaps]]
key = "meta+["
command = "jump_location_backward"
mode = "i"

# Navigate Forward
[[keymaps]]
key = "meta+]"
command = "jump_location_forward"
mode = "i"

# Find Next
[[keymaps]]
key = "meta+g"
command = "search_forward"

# Find Previous
[[keymaps]]
key = "meta+shift+g"
command = "search_backward"

# Find Action
[[keymaps]]
key = "meta+shift+a"
command = "palette.command"

# Go to File
[[keymaps]]
key = "meta+shift+o"
command = "palette"

# Go to Class / Symbol
[[keymaps]]
key = "meta+o"
command = "palette.workspace_symbol"
when = "editor_focus"

# New File
[[keymaps]]
key = "meta+n"
command = "new_file"

# File Structure
[[keymaps]]
key = "meta+f12"
command = "palette.symbol"

# Go to Declaration
[[keymaps]]
key = "meta+b"
command = "goto_definition"
when = "editor_focus"
mode = "i"

# Go to Implementation
[[keymaps]]
key = "meta+alt+b"
command = "go_to_implementation"
when = "editor_focus"

# Find Usages
[[keymaps]]
key = "alt+f7"
command = "find_references"
when = "editor_focus"

# Call Hierarchy
[[keymaps]]
key = "ctrl+alt+h"
command = "show_call_hierarchy"
when = "editor_focus"

# Toggle Line Breakpoint
[[keymaps]]
key = "meta+f8"
command = "toggle_breakpoint"
when = "editor_focus"

# Run Context Configuration
[[keymaps]]
key = "ctrl+shift+r"
command = "run_current_file"

# Debug Context Configuration
[[keymaps]]
key = "ctrl+shift+d"
command = "debug_current_file"